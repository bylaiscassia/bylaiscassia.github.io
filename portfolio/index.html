function slug(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
function pauseAll(){document.querySelectorAll(".vbox video").forEach(function(o){o.pause();});}
var fl=document.getElementById("filters"), list=document.getElementById("list"), secs=[];
function filtrar(id){
  fl.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.id===id?"true":"false");});
  pauseAll();
  secs.forEach(function(s){
    if(id==="todos"){s.hidden=false;s.open=false;}
    else{s.hidden=s.id!==id;s.open=s.id===id;}
  });
}
var all=el("button",null,"Todos");all.type="button";all.dataset.id="todos";all.setAttribute("aria-pressed","true");all.onclick=function(){filtrar("todos")};fl.appendChild(all);
DATA.forEach(function(n){
  var id=slug(n.nicho);
  var b=el("button",null,n.nicho);b.type="button";b.dataset.id=id;b.setAttribute("aria-pressed","false");b.onclick=function(){filtrar(id)};fl.appendChild(b);
  var sec=el("details","niche");sec.id=id;secs.push(sec);
  var sm=el("summary");sm.append(el("h2",null,n.nicho),el("span","count",n.videos.length+" vídeos"));
  var ch=el("span","chev");ch.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9l6 6 6-6"/></svg>';sm.appendChild(ch);
  sec.appendChild(sm);
  var inner=el("div","inner");
  if(DESC[n.nicho])inner.appendChild(el("p","desc",DESC[n.nicho]));
  var g=el("div","row");
  n.videos.forEach(function(v){
    var f=el("figure","vcard"),box=el("div","vbox");
    var b=el("button","play");b.type="button";b.setAttribute("aria-label","Assistir vídeo "+v.marca);
    var im=el("img");im.src="/posters/"+v.id+".jpg";im.alt="";im.loading="lazy";
    var s=el("span");s.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>';
    b.append(im,s);box.appendChild(b);box.appendChild(el("span","dur",v.dur+"s"));

      pauseAll();
      var vid=el("video");vid.src="/videos/"+v.id+".mp4";vid.poster="/posters/"+v.id+".jpg";vid.controls=true;vid.playsInline=true;vid.setAttribute("playsinline","");

  });
  inner.appendChild(g);sec.appendChild(inner);
  sec.addEventListener("toggle",function(){if(!sec.open)pauseAll();});
  list.appendChild(sec);
});
